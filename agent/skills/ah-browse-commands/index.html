<!DOCTYPE html>
<!-- Design System: v1.9.0 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commands Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css">
    <!-- Shoelace Web Components -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css" />
    <link rel="stylesheet" href="/static/styles/shoelace-theme.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
</head>
<body>
    <header class="header" id="site-header"></header>
    <main class="main">
        <section class="page-hero page-hero--single">
            <div class="page-hero-content">
                <h1>Commands</h1>
                <p>등록된 모든 슬래시 커맨드를 한눈에 확인하고 빠르게 복사할 수 있습니다.</p>
                <div class="page-hero-meta-grid">
                    <div class="page-hero-meta-item">
                        <div class="page-hero-meta-label">LOCATION</div>
                        <div class="page-hero-meta-value"><code>~/.claude/commands/</code></div>
                    </div>
                    <div class="page-hero-meta-item">
                        <div class="page-hero-meta-label">FORMAT</div>
                        <div class="page-hero-meta-value">Markdown with YAML frontmatter</div>
                    </div>
                    <div class="page-hero-meta-item">
                        <div class="page-hero-meta-label">FRONTMATTER</div>
                        <div class="page-hero-meta-value"><code>description</code>, <code>allowed-tools</code>, <code>argument-hint</code></div>
                    </div>
                    <div class="page-hero-meta-item">
                        <div class="page-hero-meta-label">USAGE</div>
                        <div class="page-hero-meta-value">Type <code>/command</code> in the harness</div>
                    </div>
                </div>
            </div>
        </section>

        <div class="page-layout">
            <article class="page-main">
                <div class="content-section">
                    <input type="text" class="input" id="searchInput" placeholder="Search commands..." style="max-width:400px;">
                    <p id="commandsCount" style="font-size:12px;color:var(--color-gray-mid);margin-top:16px;">Loading...</p>
                </div>

                <div class="content-section">
                    <ul class="item-list" id="commandsGrid"></ul>
                </div>
            </article>
        </div>

        <section class="related-section">
            <div class="related-grid" id="relatedSkills"></div>
        </section>
    </main>
    <footer class="footer" id="site-footer"></footer>
    <script src="/static/scripts/layout.js"></script>
    <script>
        let allCommands = [];

        async function loadCommands() {
            try {
                const res = await fetch('/api/commands');
                const data = await res.json();
                allCommands = data.commands;
                renderCommands(allCommands);
            } catch (e) {
                console.error('Failed to load commands:', e);
                document.getElementById('commandsCount').textContent = 'Failed to load commands';
            }
        }

        function renderCommands(commands) {
            const grid = document.getElementById('commandsGrid');
            const count = document.getElementById('commandsCount');

            count.textContent = `${commands.length} commands found`;
            grid.innerHTML = '';

            commands.forEach(cmd => {
                const li = document.createElement('li');
                const argHint = cmd.argumentHint ? `<span class="arg-hint">${cmd.argumentHint}</span>` : '';
                const platform = cmd.platform && cmd.platform !== 'all'
                    ? `<span class="skill-platform skill-platform--${cmd.platform}">${cmd.platform === 'win' ? 'Win' : 'Mac'}</span>`
                    : '';
                li.innerHTML = `
                    <span class="item-name--mono">/${cmd.name}</span>${argHint}${platform}
                    <span class="item-meta">${cmd.description || 'No description'}</span>
                    <button class="copy-btn" onclick="copyCommand('/${cmd.name}')" title="Copy command">
                        <svg xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 -960 960 960" width="16px" fill="currentColor"><path d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z"/></svg>
                    </button>
                `;
                grid.appendChild(li);
            });
        }

        function copyCommand(command) {
            navigator.clipboard.writeText(command).then(() => {
                const btn = event.target.closest('button');
                const originalTitle = btn.title;
                btn.title = 'Copied!';
                btn.style.opacity = '0.5';
                setTimeout(() => {
                    btn.title = originalTitle;
                    btn.style.opacity = '1';
                }, 1500);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allCommands.filter(cmd =>
                cmd.name.toLowerCase().includes(query) ||
                (cmd.description && cmd.description.toLowerCase().includes(query))
            );
            renderCommands(filtered);
        });

        async function loadRelatedSkills() {
            try {
                const res = await fetch('/api/skills');
                const data = await res.json();
                const browseSkills = data.skills.filter(s =>
                    s.category === 'Browse' && s.id !== 'ah-browse-commands'
                ).slice(0, 3);

                const grid = document.getElementById('relatedSkills');
                if (browseSkills.length === 0) {
                    grid.parentElement.style.display = 'none';
                    return;
                }

                browseSkills.forEach(skill => {
                    const card = document.createElement('a');
                    card.href = `/skills/${skill.id}`;
                    card.className = 'related-card';
                    card.innerHTML = `
                        <div class="related-card-name">${skill.name}</div>
                        <div class="related-card-desc">${skill.description}</div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                document.getElementById('relatedSkills').parentElement.style.display = 'none';
            }
        }

        loadCommands();
        loadRelatedSkills();
    </script>
</body>
</html>
