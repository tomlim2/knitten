<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commands Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css">
    <style>
        .commands-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }
        .command-card {
            background: var(--color-white);
            border: 1px solid var(--color-border);
            padding: 20px;
            transition: border-color 0.15s ease;
        }
        .command-card:hover {
            border-color: var(--color-border-hover);
        }
        .command-name {
            font-size: 16px;
            font-weight: 500;
            color: var(--color-black);
            margin-bottom: 8px;
            font-family: 'SF Mono', Consolas, Monaco, monospace;
        }
        .command-name::before {
            content: '/';
            color: var(--color-gray-mid);
        }
        .command-description {
            font-size: 14px;
            color: var(--color-gray-dark);
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .command-tools {
            font-size: 11px;
            color: var(--color-gray-mid);
            font-family: 'SF Mono', Consolas, Monaco, monospace;
            background: var(--color-gray-light);
            padding: 8px 10px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .commands-count {
            font-size: 13px;
            color: var(--color-gray-mid);
            margin-bottom: 24px;
        }
        .search-box {
            margin-bottom: 24px;
        }
        .search-input {
            width: 100%;
            max-width: 400px;
            padding: 10px 0;
            border: none;
            border-bottom: 1px solid var(--color-border);
            font-size: 14px;
            font-family: inherit;
            background: transparent;
        }
        .search-input:focus {
            outline: none;
            border-bottom-color: var(--color-black);
        }
        @media (max-width: 1024px) {
            .commands-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 768px) {
            .commands-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Skill Server</a>
        <nav class="nav">
            <a href="/">Skills</a>
            <a href="/files">Files</a>
        </nav>
    </header>
    <main class="main">
        <div class="skill-toolbar">
            <span class="skill-title">Commands Browser</span>
            <span class="skill-badge">web</span>
            <a href="/" class="back-button">Back</a>
        </div>
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Search commands...">
        </div>
        <p class="commands-count" id="commandsCount">Loading...</p>
        <div class="commands-grid" id="commandsGrid">
            <!-- Commands loaded dynamically -->
        </div>
    </main>
    <footer class="site-footer">
        <div class="footer-content">
            <span class="footer-copyright">Commands Browser v0.1.0</span>
        </div>
    </footer>
    <script>
        let allCommands = [];

        async function loadCommands() {
            try {
                const res = await fetch('/api/commands');
                const data = await res.json();
                allCommands = data.commands;
                renderCommands(allCommands);
            } catch (e) {
                console.error('Failed to load commands:', e);
                document.getElementById('commandsCount').textContent = 'Failed to load commands';
            }
        }

        function renderCommands(commands) {
            const grid = document.getElementById('commandsGrid');
            const count = document.getElementById('commandsCount');

            count.textContent = `${commands.length} commands registered`;
            grid.innerHTML = '';

            commands.forEach(cmd => {
                const card = document.createElement('div');
                card.className = 'command-card';
                card.innerHTML = `
                    <div class="command-name">${cmd.name}</div>
                    <p class="command-description">${cmd.description || 'No description'}</p>
                    ${cmd.allowedTools ? `<div class="command-tools">${cmd.allowedTools}</div>` : ''}
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allCommands.filter(cmd =>
                cmd.name.toLowerCase().includes(query) ||
                (cmd.description && cmd.description.toLowerCase().includes(query))
            );
            renderCommands(filtered);
        });

        loadCommands();
    </script>
</body>
</html>
