<!-- Design System: v1.6.2 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage Statistics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css">
    <style>
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 48px;
        }
        .stat-card {
            background: var(--color-white);
            border: 1px solid var(--color-border);
            padding: 24px;
            text-align: center;
        }
        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0;
            color: var(--color-gray-mid);
            margin-bottom: 12px;
            font-weight: 500;
        }
        .stat-value {
            font-size: 48px;
            font-weight: 400;
            color: var(--color-black);
            letter-spacing: 0;
            line-height: 1;
        }

        /* Usage Table */
        .usage-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 32px;
        }
        .usage-table th {
            text-align: left;
            font-size: 12px;
            font-weight: 500;
            color: var(--color-gray-mid);
            padding: 12px 16px;
            border-bottom: 1px solid var(--color-border);
            text-transform: uppercase;
            letter-spacing: 0;
        }
        .usage-table td {
            padding: 16px;
            border-bottom: 1px solid var(--color-border);
            font-size: 14px;
            letter-spacing: 0;
        }
        .usage-table tr:last-child td {
            border-bottom: none;
        }

        /* Usage Bar */
        .usage-bar-container {
            width: 200px;
            height: 20px;
            border: 1px solid var(--color-border);
            background: var(--color-white);
            position: relative;
        }
        .usage-bar-fill {
            height: 100%;
            background: var(--color-black);
            transition: width 0.3s ease;
        }

        /* Recent Activity */
        .activity-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .activity-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--color-border);
            font-size: 12px;
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        .activity-name {
            color: var(--color-black);
            margin-bottom: 4px;
            font-weight: 400;
        }
        .activity-time {
            color: var(--color-gray-mid);
            font-size: 11px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--color-gray-mid);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Skill Server</a>
        <nav class="nav">
            <a href="/">Skills</a>
            <a href="/skills/browse-commands">Commands</a>
            <a href="/skills/learn-browse-entries">Learnings</a>
            <a href="/skills/browse-standards">Standards</a>
            <a href="/skills/browse-usage" class="active">Usage</a>
            <a href="/files">Files</a>
        </nav>
    </header>
    <main class="main">
        <section class="page-hero page-hero--single">
            <div class="page-hero-content">
                <h1 class="page-hero-name">Usage Statistics</h1>
                <p class="page-hero-desc">실제 사용 빈도 기반 통계 및 시각화</p>
            </div>
        </section>

        <!-- Stats Overview -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Total Uses</div>
                <div class="stat-value" id="totalUses">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Skills</div>
                <div class="stat-value" id="skillsCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Commands</div>
                <div class="stat-value" id="commandsCount">0</div>
            </div>
        </div>

        <div class="page-layout">
            <article class="page-main">
                <!-- Top Skills -->
                <div class="content-section">
                    <h2 style="font-size:16px;font-weight:500;margin-bottom:16px;letter-spacing:0;">Most Used Skills</h2>
                    <div id="skillsTableContainer"></div>
                </div>

                <!-- Top Commands -->
                <div class="content-section">
                    <h2 style="font-size:16px;font-weight:500;margin-bottom:16px;letter-spacing:0;">Most Used Commands</h2>
                    <div id="commandsTableContainer"></div>
                </div>
            </article>

            <aside class="page-sidebar">
                <div class="page-sidebar-item">
                    <div class="page-sidebar-label">Recent Activity</div>
                    <div class="page-sidebar-value">
                        <ul class="activity-list" id="recentActivity"></ul>
                    </div>
                </div>
                <div class="page-sidebar-item">
                    <div class="page-sidebar-label">Data Location</div>
                    <div class="page-sidebar-value">
                        <code>~/.claude/private/<br>usage-stats.json</code>
                    </div>
                </div>
            </aside>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <span class="footer-copyright">© 2026 Skill Server</span>
            <span class="footer-version">v1.7.0</span>
        </div>
    </footer>
    <script>
        async function loadUsageStats() {
            try {
                const res = await fetch('/api/usage/stats');
                const data = await res.json();
                renderStats(data);
            } catch (e) {
                console.error('Failed to load usage stats:', e);
            }
        }

        function renderStats(data) {
            // Calculate totals
            let totalUses = 0;
            const skills = [];
            const commands = [];
            const allActivity = [];

            if (data.skills) {
                Object.entries(data.skills).forEach(([id, info]) => {
                    totalUses += info.count;
                    skills.push({ name: id, count: info.count, lastUsed: info.lastUsed, type: 'skill' });
                    allActivity.push({ name: id, type: 'skill', lastUsed: info.lastUsed });
                });
            }

            if (data.commands) {
                Object.entries(data.commands).forEach(([id, info]) => {
                    totalUses += info.count;
                    commands.push({ name: `/${id}`, count: info.count, lastUsed: info.lastUsed, type: 'command' });
                    allActivity.push({ name: `/${id}`, type: 'command', lastUsed: info.lastUsed });
                });
            }

            // Update overview cards
            document.getElementById('totalUses').textContent = totalUses;
            document.getElementById('skillsCount').textContent = skills.length;
            document.getElementById('commandsCount').textContent = commands.length;

            // Sort by count
            skills.sort((a, b) => b.count - a.count);
            commands.sort((a, b) => b.count - a.count);

            // Render tables
            renderTable('skillsTableContainer', skills.slice(0, 10));
            renderTable('commandsTableContainer', commands.slice(0, 10));

            // Render recent activity
            allActivity.sort((a, b) => new Date(b.lastUsed) - new Date(a.lastUsed));
            renderActivity(allActivity.slice(0, 5));
        }

        function renderTable(containerId, items) {
            const container = document.getElementById(containerId);

            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">No usage data yet</div>';
                return;
            }

            const maxCount = Math.max(...items.map(i => i.count));
            let html = '<table class="usage-table"><thead><tr>';
            html += '<th>Name</th><th>Uses</th><th>Usage</th><th>Last Used</th>';
            html += '</tr></thead><tbody>';

            items.forEach(item => {
                const percentage = (item.count / maxCount) * 100;
                html += '<tr>';
                html += `<td><strong>${item.name}</strong></td>`;
                html += `<td>${item.count}</td>`;
                html += `<td><div class="usage-bar-container"><div class="usage-bar-fill" style="width:${percentage}%"></div></div></td>`;
                html += `<td style="color:var(--color-gray-mid);font-size:12px;">${formatTime(item.lastUsed)}</td>`;
                html += '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function renderActivity(items) {
            const container = document.getElementById('recentActivity');

            if (items.length === 0) {
                container.innerHTML = '<li class="activity-item" style="color:var(--color-gray-mid);">No activity yet</li>';
                return;
            }

            let html = '';
            items.forEach(item => {
                html += '<li class="activity-item">';
                html += `<div class="activity-name">${item.name}</div>`;
                html += `<div class="activity-time">${formatTime(item.lastUsed)}</div>`;
                html += '</li>';
            });

            container.innerHTML = html;
        }

        function formatTime(timestamp) {
            const now = new Date();
            const past = new Date(timestamp);
            const diffMs = now - past;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays < 7) return `${diffDays}d ago`;
            return past.toLocaleDateString();
        }

        loadUsageStats();
    </script>
</body>
</html>
