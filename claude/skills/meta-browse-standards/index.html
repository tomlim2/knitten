<!DOCTYPE html>
<!-- Design System: v1.9.0 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standards Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css">
    <!-- Shoelace Web Components -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css" />
    <link rel="stylesheet" href="/static/styles/shoelace-theme.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
    <link rel="stylesheet" href="/static/styles/markdown-reading.css">
    <script src="/static/scripts/marked.js"></script>
    <style>
        .page-layout--two-column {
            grid-template-columns: 240px 1fr;
        }
        .page-sidebar {
            width: 240px;
        }
        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-nav a {
            display: block;
            padding: 6px 12px;
            font-size: 12px;
            color: var(--color-gray-dark);
            text-decoration: none;
            transition: color 0.15s ease;
        }
        .sidebar-nav a:hover {
            color: var(--color-black);
        }
        .sidebar-nav a.active {
            color: var(--color-black);
            font-weight: 500;
            border-left: 2px solid var(--color-black);
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <header class="header" id="site-header"></header>
    <main class="main">
        <section class="page-hero page-hero--single">
            <div class="page-hero-content">
                <h1>Standards</h1>
                <p>프로젝트 표준 문서 브라우저</p>
                <div class="page-hero-meta-grid">
                    <div class="page-hero-meta-item">
                        <div class="page-hero-meta-label">LOCATION</div>
                        <div class="page-hero-meta-value"><code>~/.claude/standards/</code></div>
                    </div>
                </div>
            </div>
        </section>

        <div class="page-layout page-layout--two-column">
            <aside class="page-sidebar">
                <h2 style="font-size:16px;font-weight:500;margin-bottom:16px;letter-spacing:0;">Standards</h2>
                <nav id="standardsList" class="sidebar-nav">Loading...</nav>
            </aside>
            <article class="page-main markdown-body" id="standardContent">
            </article>
        </div>
    </main>
    <footer class="footer" id="site-footer"></footer>
    <script src="/static/scripts/layout.js"></script>
    <script>
        let standardNames = [];

        async function loadStandards() {
            try {
                const res = await fetch('/api/standards');
                const data = await res.json();
                const nav = document.getElementById('standardsList');
                nav.innerHTML = '';
                standardNames = data.standards.map(s => s.name);

                data.standards.forEach(std => {
                    const link = document.createElement('a');
                    link.href = '#' + std.name;
                    link.textContent = std.name;
                    link.dataset.name = std.name;
                    link.onclick = (e) => {
                        e.preventDefault();
                        selectStandard(std.name);
                    };
                    nav.appendChild(link);
                });

                const hash = window.location.hash.slice(1);
                if (hash && standardNames.includes(hash)) {
                    selectStandard(hash);
                } else if (standardNames.length > 0) {
                    selectStandard(standardNames[0]);
                }
            } catch (e) {
                console.error('Failed to load standards:', e);
            }
        }

        function selectStandard(name) {
            history.replaceState(null, '', '#' + name);
            document.querySelectorAll('#standardsList a').forEach(a => {
                a.classList.toggle('active', a.dataset.name === name);
            });
            loadStandardContent(name);
        }

        async function loadStandardContent(name) {
            try {
                const res = await fetch(`/api/standards/${name}`);
                const text = await res.text();
                const html = marked.parse(text);
                document.getElementById('standardContent').innerHTML = html;
                addCopyButtonsToCodeBlocks();
            } catch (e) {
                document.getElementById('standardContent').innerHTML = '<p style="color:var(--color-gray-mid);">Failed to load standard</p>';
            }
        }

        function addCopyButtonsToCodeBlocks() {
            const codeBlocks = document.querySelectorAll('#standardContent pre code');
            codeBlocks.forEach(code => {
                const pre = code.parentElement;
                if (pre && !pre.querySelector('.copy-code-btn')) {
                    const button = document.createElement('button');
                    button.className = 'copy-code-btn';
                    button.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="5" y="5" width="9" height="9" rx="1"/>
                        <path d="M3 10V3a1 1 0 0 1 1-1h7"/>
                    </svg>`;
                    button.onclick = () => {
                        navigator.clipboard.writeText(code.textContent);
                    };
                    pre.appendChild(button);
                }
            });
        }

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.slice(1);
            if (hash && standardNames.includes(hash)) {
                selectStandard(hash);
            }
        });

        loadStandards();
    </script>
</body>
</html>
