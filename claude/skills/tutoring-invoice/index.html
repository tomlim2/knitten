<!DOCTYPE html>
<!-- Design System: v1.7.0 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css">
    <link rel="stylesheet" href="/skills/tutoring-invoice/style.css">
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Skill Server</a>
        <nav class="nav">
            <a href="/">Skills</a>
            <a href="/files">Files</a>
        </nav>
    </header>

    <div class="container">
        <div class="form-section">
            <h2>청구서 정보 입력</h2>
            <form id="invoiceForm">
                <div class="form-group">
                    <label>학생 이름</label>
                    <input type="text" id="studentName" placeholder="학생 이름" required>
                </div>

                <div class="form-group">
                    <label>시간당 수업료 (원)</label>
                    <input type="number" id="hourlyRate" placeholder="150000" required>
                </div>

                <div class="form-group">
                    <label>수업 내역</label>
                    <div class="class-entry-header">
                        <span>날짜</span>
                        <span>시간</span>
                        <span>분</span>
                        <span>비고</span>
                        <span></span>
                    </div>
                    <div id="classEntries">
                        <div class="class-entry">
                            <input type="date" class="class-date" required>
                            <input type="number" class="class-hours" placeholder="0" step="0.5" required>
                            <input type="number" class="class-minutes" placeholder="0" step="15">
                            <input type="text" class="class-note" placeholder="비고">
                            <button type="button" class="btn btn-secondary btn-small" onclick="removeEntry(this)">삭제</button>
                        </div>
                    </div>
                    <button type="button" id="addEntry" class="btn btn-secondary">+ 수업 추가</button>
                </div>

                <div class="form-group">
                    <label>은행</label>
                    <input type="text" id="bankName" placeholder="은행명" required>
                </div>

                <div class="form-group">
                    <label>계좌번호</label>
                    <input type="text" id="accountNumber" placeholder="계좌번호" required>
                </div>

                <div class="form-group">
                    <label>예금주</label>
                    <input type="text" id="accountHolder" placeholder="예금주" required>
                </div>

                <button type="submit" class="btn btn-primary">청구서 생성</button>
            </form>
            <p class="version-footer" id="versionForm"></p>
        </div>

        <div class="invoice-section" id="invoicePreview" style="display: none;">
            <div id="invoice">
                <!-- Header -->
                <header class="invoice-header">
                    <div class="invoice-from">
                        <p class="sender-name">튜토링</p>
                        <p>임연수</p>
                    </div>
                    <div class="invoice-meta">
                        <p class="invoice-number-label">Invoice <span id="invoiceNumber"></span></p>
                        <p class="invoice-date" id="invoiceDate"></p>
                    </div>
                </header>

                <hr class="divider">

                <!-- Bill To -->
                <section class="bill-to">
                    <p class="recipient-name" id="studentNameDisplay"></p>
                </section>

                <hr class="divider">

                <!-- Items -->
                <section class="invoice-items">
                    <p class="item-title" id="invoiceTitle"></p>
                    <div id="classListSimple"></div>
                    <p class="rate-info">시간당 <span id="displayRate"></span>원 × <span id="totalHours"></span>시간</p>
                </section>

                <!-- Total -->
                <div class="invoice-total">
                    <div class="total-line"></div>
                    <div class="total-row">
                        <span class="total-label">Total</span>
                        <span class="total-amount" id="totalAmount"></span>
                    </div>
                </div>

                <hr class="divider">

                <!-- Payment Info -->
                <section class="payment-info">
                    <p class="section-title">입금 정보</p>
                    <p><span id="displayBank"></span> <span id="displayAccount"></span></p>
                    <p>예금주: <span id="displayHolder"></span></p>
                </section>

                <hr class="divider">

                <!-- Footer -->
                <footer class="invoice-footer">
                    <p>임연수 · tomandlim@gmail.com</p>
                </footer>
            </div>

            <button id="downloadPDF" class="btn btn-primary">PDF로 저장</button>
            <button id="editInvoice" class="btn btn-secondary">수정하기</button>
            <p class="version-footer" id="version"></p>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <span>© 2026 Skill Server</span>
            <span>v1.2.0</span>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="/skills/tutoring-invoice/script.js"></script>
</body>
</html>
