<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commands Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css">
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Skill Server</a>
        <nav class="nav">
            <a href="/">Skills</a>
            <a href="/files">Files</a>
        </nav>
    </header>
    <main class="main">
        <section class="page-hero">
            <h1 class="page-hero-name">Commands</h1>
            <div class="page-hero-meta">
                <span>v0.1.0</span>
                <span>web</span>
            </div>
            <p class="page-hero-desc">Claude Code에 등록된 모든 슬래시 커맨드 목록</p>
        </section>

        <div class="page-layout">
            <article class="page-main">
                <div class="content-section">
                    <input type="text" class="input" id="searchInput" placeholder="Search commands..." style="max-width:400px;margin-bottom:24px;">
                    <p id="commandsCount" style="font-size:13px;color:var(--color-gray-mid);margin-bottom:24px;">Loading...</p>
                </div>
                <ul class="item-list" id="commandsGrid"></ul>
            </article>

            <aside class="page-sidebar">
                <div class="page-sidebar-item">
                    <div class="page-sidebar-label">Location</div>
                    <div class="page-sidebar-value">
                        ~/.claude/commands/
                    </div>
                </div>
                <div class="page-sidebar-item">
                    <div class="page-sidebar-label">Format</div>
                    <div class="page-sidebar-value">
                        Markdown with frontmatter
                    </div>
                </div>
            </aside>
        </div>
    </main>
    <footer class="site-footer">
        <div class="footer-content">
            <span class="footer-copyright">Commands Browser v0.1.0</span>
        </div>
    </footer>
    <script>
        let allCommands = [];

        async function loadCommands() {
            try {
                const res = await fetch('/api/commands');
                const data = await res.json();
                allCommands = data.commands;
                renderCommands(allCommands);
            } catch (e) {
                console.error('Failed to load commands:', e);
                document.getElementById('commandsCount').textContent = 'Failed to load commands';
            }
        }

        function renderCommands(commands) {
            const grid = document.getElementById('commandsGrid');
            const count = document.getElementById('commandsCount');

            count.textContent = `${commands.length} commands`;
            grid.innerHTML = '';

            commands.forEach(cmd => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="item-name--mono">/${cmd.name}</span>
                    <span class="item-meta">${cmd.description || 'No description'}</span>
                    <button class="copy-btn" onclick="copyCommand('/${cmd.name}')" title="Copy command">Copy</button>
                `;
                grid.appendChild(li);
            });
        }

        function copyCommand(command) {
            navigator.clipboard.writeText(command).then(() => {
                const btn = event.target;
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy', 1500);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allCommands.filter(cmd =>
                cmd.name.toLowerCase().includes(query) ||
                (cmd.description && cmd.description.toLowerCase().includes(query))
            );
            renderCommands(filtered);
        });

        loadCommands();
    </script>
</body>
</html>
