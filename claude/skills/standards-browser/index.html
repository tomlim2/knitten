<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standards Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css">
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Skill Server</a>
        <nav class="nav">
            <a href="/">Skills</a>
            <a href="/files">Files</a>
        </nav>
    </header>
    <main class="main">
        <section class="page-hero">
            <h1 class="page-hero-name">Standards</h1>
            <div class="page-hero-meta">
                <span>v0.1.0</span>
                <span>web</span>
            </div>
            <p class="page-hero-desc">프로젝트 표준 문서 브라우저</p>
        </section>

        <div class="page-layout">
            <article class="page-main" id="standardContent">
                <p style="color:var(--color-gray-mid);font-size:14px;">Select a standard to view</p>
            </article>

            <aside class="page-sidebar">
                <div class="page-sidebar-item">
                    <div class="page-sidebar-label">Standards</div>
                    <div class="page-sidebar-value" id="standardsList">
                        Loading...
                    </div>
                </div>
                <div class="page-sidebar-item">
                    <div class="page-sidebar-label">Location</div>
                    <div class="page-sidebar-value">
                        ~/.claude/standards/
                    </div>
                </div>
                <div class="page-sidebar-item">
                    <div class="page-sidebar-label">Navigation</div>
                    <div class="page-sidebar-value">
                        <a href="/" class="page-sidebar-link">Back to Skills</a>
                    </div>
                </div>
            </aside>
        </div>
    </main>
    <footer class="site-footer">
        <div class="footer-content">
            <span class="footer-copyright">Standards Browser v0.1.0</span>
        </div>
    </footer>
    <script>
        async function loadStandards() {
            try {
                const res = await fetch('/api/standards');
                const data = await res.json();
                const list = document.getElementById('standardsList');
                list.innerHTML = '';

                data.standards.forEach(std => {
                    const link = document.createElement('a');
                    link.href = '#';
                    link.className = 'page-sidebar-link';
                    link.style.display = 'block';
                    link.style.marginBottom = '8px';
                    link.textContent = std.name;
                    link.onclick = (e) => {
                        e.preventDefault();
                        loadStandard(std.name);
                    };
                    list.appendChild(link);
                });
            } catch (e) {
                console.error('Failed to load standards:', e);
            }
        }

        async function loadStandard(name) {
            try {
                const res = await fetch(`/api/standards/${name}`);
                const text = await res.text();
                renderMarkdown(text);
            } catch (e) {
                document.getElementById('standardContent').innerHTML = '<p style="color:var(--color-gray-mid);">Failed to load standard</p>';
            }
        }

        function renderMarkdown(md) {
            const content = document.getElementById('standardContent');
            let html = md
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/^### (.*$)/gm, '<h3>$1</h3>')
                .replace(/^## (.*$)/gm, '<h2>$1</h2>')
                .replace(/^# (.*$)/gm, '<h2>$1</h2>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/^\- (.*$)/gm, '<li>$1</li>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');

            html = '<p>' + html + '</p>';
            html = html.replace(/<p><h/g, '<h').replace(/<\/h(\d)><\/p>/g, '</h$1>');
            html = html.replace(/<p><pre>/g, '<pre>').replace(/<\/pre><\/p>/g, '</pre>');
            html = html.replace(/<p><li>/g, '<ul><li>').replace(/<\/li><\/p>/g, '</li></ul>');
            html = html.replace(/<\/li><br><li>/g, '</li><li>');
            html = html.replace(/<p><br><\/p>/g, '');
            html = html.replace(/<p><\/p>/g, '');

            content.innerHTML = html;
        }

        loadStandards();
    </script>
</body>
</html>
