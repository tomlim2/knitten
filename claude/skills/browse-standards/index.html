<!DOCTYPE html>
<!-- Design System: v1.7.0 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standards Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css">
    <script src="/static/scripts/marked.js"></script>
    <style>
        /* Minimal Reading Typography */
        .page-main {
            max-width: 700px;
            font-size: 12px;
            line-height: 1.6;
        }
        .page-main h1 {
            font-size: 20px;
            font-weight: 500;
            line-height: 1.3;
            margin: 0 0 20px 0;
            letter-spacing: 0;
        }
        .page-main h2 {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
            margin: 32px 0 12px 0;
            letter-spacing: 0;
            text-transform: none;
            color: var(--color-black);
        }
        .page-main h3 {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            margin: 24px 0 8px 0;
            letter-spacing: 0;
        }
        .page-main p {
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 16px;
            color: var(--color-text);
        }
        .page-main ul, .page-main ol {
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 16px;
            padding-left: 24px;
        }
        .page-main li {
            font-size: 12px;
            margin-bottom: 6px;
        }
        .page-main code {
            font-size: 11px;
            padding: 2px 4px;
            background: var(--color-gray-light);
            border-radius: 2px;
        }
        .page-main pre {
            font-size: 11px;
            line-height: 1.5;
            padding: 16px;
            margin: 16px 0;
            background: var(--color-gray-light);
            border-radius: 4px;
            overflow-x: auto;
        }
        .page-main pre code {
            font-size: 11px;
            padding: 0;
            background: transparent;
        }
        .page-main blockquote {
            font-size: 12px;
            line-height: 1.6;
            margin: 16px 0;
            padding-left: 16px;
            border-left: 2px solid var(--color-border);
            color: var(--color-gray-mid);
        }
        .page-main table {
            font-size: 12px;
            line-height: 1.5;
            border-spacing: 0;
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
        }
        .page-main table th,
        .page-main table td {
            padding: 8px 12px;
            border: 1px solid var(--color-border);
            text-align: left;
        }
        .page-main table th {
            font-weight: 500;
            background: var(--color-gray-light);
        }
        .page-main table tr:nth-child(even) {
            background: var(--color-bg);
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Skill Server</a>
        <nav class="nav">
            <a href="/">Skills</a>
            <a href="/skills/browse-commands">Commands</a>
            <a href="/skills/learn-browse-entries">Learnings</a>
            <a href="/skills/browse-standards" class="active">Standards</a>
            <a href="/skills/browse-usage">Usage</a>
            <a href="/files">Files</a>
        </nav>
    </header>
    <main class="main">
        <section class="page-hero page-hero--single">
            <div class="page-hero-content">
                <h1 class="page-hero-name">Standards</h1>
                <p class="page-hero-desc">프로젝트 표준 문서 브라우저</p>
            </div>
        </section>

        <div class="page-layout">
            <article class="page-main markdown-body" id="standardContent">
                <p style="color:var(--color-gray-mid);font-size:14px;">Select a standard to view</p>
            </article>

            <aside class="page-sidebar">
                <div class="page-sidebar-item">
                    <div class="page-sidebar-label">Standards</div>
                    <div class="page-sidebar-value" id="standardsList">
                        Loading...
                    </div>
                </div>
                <div class="page-sidebar-item">
                    <div class="page-sidebar-label">Location</div>
                    <div class="page-sidebar-value">
                        <code>~/.claude/standards/</code>
                    </div>
                </div>
            </aside>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <span class="footer-copyright">© 2026 Skill Server</span>
            <span class="footer-version">v1.7.0</span>
        </div>
    </footer>
    <script>
        async function loadStandards() {
            try {
                const res = await fetch('/api/standards');
                const data = await res.json();
                const list = document.getElementById('standardsList');
                list.innerHTML = '';

                data.standards.forEach(std => {
                    const link = document.createElement('a');
                    link.href = '#';
                    link.className = 'page-sidebar-link';
                    link.style.display = 'block';
                    link.style.marginBottom = '8px';
                    link.textContent = std.name;
                    link.onclick = (e) => {
                        e.preventDefault();
                        loadStandard(std.name);
                    };
                    list.appendChild(link);
                });
            } catch (e) {
                console.error('Failed to load standards:', e);
            }
        }

        async function loadStandard(name) {
            try {
                const res = await fetch(`/api/standards/${name}`);
                const text = await res.text();
                const html = marked.parse(text);
                document.getElementById('standardContent').innerHTML = html;
            } catch (e) {
                document.getElementById('standardContent').innerHTML = '<p style="color:var(--color-gray-mid);">Failed to load standard</p>';
            }
        }

        loadStandards();
    </script>
</body>
</html>
