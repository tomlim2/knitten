<!DOCTYPE html>
<!-- Design System: v1.8.1 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standards Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css">
    <link rel="stylesheet" href="/static/styles/markdown-reading.css">
    <script src="/static/scripts/marked.js"></script>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Skill Server</a>
        <nav class="nav">
            <a href="/">Skills</a>
            <a href="/skills/browse-commands">Commands</a>
            <a href="/skills/learn-browse-entries">Learnings</a>
            <a href="/skills/browse-standards" class="active">Standards</a>
            <a href="/skills/browse-usage">Usage</a>
            <a href="/files">Files</a>
        </nav>
    </header>
    <main class="main">
        <section class="page-hero page-hero--single">
            <div class="page-hero-content">
                <h1 class="page-hero-name">Standards</h1>
                <p class="page-hero-desc">프로젝트 표준 문서 브라우저</p>
                <div class="page-hero-meta-grid">
                    <div class="page-hero-meta-item">
                        <div class="page-hero-meta-label">LOCATION</div>
                        <div class="page-hero-meta-value"><code>~/.claude/standards/</code></div>
                    </div>
                </div>
            </div>
        </section>

        <div class="page-layout">
            <article class="page-main">
                <div class="content-section">
                    <h2 style="font-size:16px;font-weight:500;margin-bottom:16px;letter-spacing:0;">Standards</h2>
                    <div id="standardsList">Loading...</div>
                </div>
                <div class="content-section markdown-body" id="standardContent">
                    <p style="color:var(--color-gray-mid);font-size:14px;">Select a standard to view</p>
                </div>
            </article>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <span class="footer-copyright">© 2026 Skill Server</span>
            <span class="footer-version">v1.7.0</span>
        </div>
    </footer>
    <script>
        async function loadStandards() {
            try {
                const res = await fetch('/api/standards');
                const data = await res.json();
                const list = document.getElementById('standardsList');
                list.innerHTML = '';

                const ul = document.createElement('ul');
                ul.className = 'item-list';
                data.standards.forEach(std => {
                    const li = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = '#';
                    link.style.color = 'var(--color-black)';
                    link.style.textDecoration = 'none';
                    link.textContent = std.name;
                    link.onclick = (e) => {
                        e.preventDefault();
                        loadStandard(std.name);
                    };
                    li.appendChild(link);
                    ul.appendChild(li);
                });
                list.appendChild(ul);
            } catch (e) {
                console.error('Failed to load standards:', e);
            }
        }

        async function loadStandard(name) {
            try {
                const res = await fetch(`/api/standards/${name}`);
                const text = await res.text();
                const html = marked.parse(text);
                document.getElementById('standardContent').innerHTML = html;
                addCopyButtonsToCodeBlocks();
            } catch (e) {
                document.getElementById('standardContent').innerHTML = '<p style="color:var(--color-gray-mid);">Failed to load standard</p>';
            }
        }

        function addCopyButtonsToCodeBlocks() {
            const codeBlocks = document.querySelectorAll('#standardContent pre code');
            codeBlocks.forEach(code => {
                const pre = code.parentElement;
                if (pre && !pre.querySelector('.copy-code-btn')) {
                    const button = document.createElement('button');
                    button.className = 'copy-code-btn';
                    button.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="5" y="5" width="9" height="9" rx="1"/>
                        <path d="M3 10V3a1 1 0 0 1 1-1h7"/>
                    </svg>`;
                    button.onclick = () => {
                        navigator.clipboard.writeText(code.textContent);
                    };
                    pre.appendChild(button);
                }
            });
        }

        loadStandards();
    </script>
</body>
</html>
