<!DOCTYPE html>
<!-- Design System: v1.7.0 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnings Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css">
    <script src="/static/scripts/markdown-renderer.js"></script>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Skill Server</a>
        <nav class="nav">
            <a href="/">Skills</a>
            <a href="/skills/browse-commands">Commands</a>
            <a href="/skills/learn-browse-entries" class="active">Learnings</a>
            <a href="/skills/browse-standards">Standards</a>
            <a href="/skills/browse-usage">Usage</a>
            <a href="/files">Files</a>
        </nav>
    </header>
    <main class="main">
        <section class="page-hero page-hero--single">
            <div class="page-hero-content">
                <h1 class="page-hero-name">Learnings</h1>
                <p class="page-hero-desc">프로젝트별 학습 기록 및 인사이트</p>
            </div>
        </section>

        <div class="page-layout">
            <article class="page-main markdown-body" id="learningContent">
                <p style="color:var(--color-gray-mid);font-size:12px;">Select a project to view learnings</p>
            </article>

            <aside class="page-sidebar">
                <div class="page-sidebar-item">
                    <div class="page-sidebar-label">Projects</div>
                    <div class="page-sidebar-value" id="projectList">
                        Loading...
                    </div>
                </div>
                <div class="page-sidebar-item">
                    <div class="page-sidebar-label">Location</div>
                    <div class="page-sidebar-value">
                        <code>~/.claude/private/learnings/</code>
                    </div>
                </div>
            </aside>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <span class="footer-copyright">© 2026 Skill Server</span>
            <span class="footer-version">v1.7.0</span>
        </div>
    </footer>
    <script>
        async function loadProjects() {
            try {
                const res = await fetch('/api/files?path=learnings/projects');
                const data = await res.json();
                const projectList = document.getElementById('projectList');
                projectList.innerHTML = '';

                // Add template
                const templateLink = document.createElement('a');
                templateLink.href = '#';
                templateLink.className = 'page-sidebar-link';
                templateLink.style.display = 'block';
                templateLink.style.marginBottom = '8px';
                templateLink.textContent = '_template';
                templateLink.onclick = (e) => {
                    e.preventDefault();
                    loadLearning('_template.md');
                };
                projectList.appendChild(templateLink);

                // Add projects
                if (data.entries) {
                    data.entries.forEach(entry => {
                        if (entry.name.endsWith('.md')) {
                            const link = document.createElement('a');
                            link.href = '#';
                            link.className = 'page-sidebar-link';
                            link.style.display = 'block';
                            link.style.marginBottom = '8px';
                            link.textContent = entry.name.replace('.md', '');
                            link.onclick = (e) => {
                                e.preventDefault();
                                loadLearning('projects/' + entry.name);
                            };
                            projectList.appendChild(link);
                        }
                    });
                }
            } catch (e) {
                console.error('Failed to load projects:', e);
            }
        }

        async function loadLearning(filename) {
            try {
                const res = await fetch('/api/files?path=learnings/' + filename);
                const text = await res.text();
                const html = MarkdownRenderer.render(text);
                document.getElementById('learningContent').innerHTML = html;
            } catch (e) {
                document.getElementById('learningContent').innerHTML = '<p style="color:var(--color-gray-mid);">Failed to load learning</p>';
            }
        }

        loadProjects();
    </script>
</body>
</html>
