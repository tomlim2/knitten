<!DOCTYPE html>
<!-- Design System: v1.9.0 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnings Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css">
    <!-- Shoelace Web Components -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css" />
    <link rel="stylesheet" href="/static/styles/shoelace-theme.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
    <link rel="stylesheet" href="/static/styles/markdown-reading.css">
    <script src="/static/scripts/marked.js"></script>
    <style>
        .page-layout--two-column {
            grid-template-columns: 240px 1fr;
        }
        .page-sidebar {
            width: 240px;
        }
        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-nav a {
            display: block;
            padding: 6px 12px;
            font-size: 12px;
            color: var(--color-gray-dark);
            text-decoration: none;
            transition: color 0.15s ease;
        }
        .sidebar-nav a:hover {
            color: var(--color-black);
        }
        .sidebar-nav a.active {
            color: var(--color-black);
            font-weight: 500;
            border-left: 2px solid var(--color-black);
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Skill Server</a>
        <nav class="nav">
            <a href="/">Skills</a>
            <a href="/skills/browse-commands">Commands</a>
            <a href="/skills/learn-browse-entries" class="active">Learnings</a>
            <a href="/skills/browse-standards">Standards</a>
            <a href="/skills/browse-usage">Usage</a>
            <a href="/files">Files</a>
        </nav>
    </header>
    <main class="main">
        <section class="page-hero page-hero--single">
            <div class="page-hero-content">
                <h1>Learnings</h1>
                <p>프로젝트별 학습 기록 및 인사이트</p>
                <div class="page-hero-meta-grid">
                    <div class="page-hero-meta-item">
                        <div class="page-hero-meta-label">LOCATION</div>
                        <div class="page-hero-meta-value"><code>~/.claude/private/learnings/</code></div>
                    </div>
                </div>
            </div>
        </section>

        <div class="page-layout page-layout--two-column">
            <aside class="page-sidebar">
                <h2 style="font-size:16px;font-weight:500;margin-bottom:16px;letter-spacing:0;">Projects</h2>
                <nav id="projectList" class="sidebar-nav">Loading...</nav>
            </aside>
            <article class="page-main markdown-body" id="learningContent">
            </article>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <span class="footer-copyright">© 2026 Skill Server</span>
            <span class="footer-version">v1.9.0</span>
        </div>
    </footer>
    <script>
        const entries = [];

        async function loadProjects() {
            try {
                const res = await fetch('/api/files?path=learnings/projects');
                const data = await res.json();
                const nav = document.getElementById('projectList');
                nav.innerHTML = '';

                // Add template
                addEntry(nav, '_template', '_template.md');

                // Add projects
                if (data.entries) {
                    data.entries.forEach(entry => {
                        if (entry.name.endsWith('.md')) {
                            const name = entry.name.replace('.md', '');
                            addEntry(nav, name, 'projects/' + entry.name);
                        }
                    });
                }

                const hash = window.location.hash.slice(1);
                const match = entries.find(e => e.name === hash);
                if (match) {
                    selectLearning(match.name, match.path);
                } else if (entries.length > 0) {
                    selectLearning(entries[0].name, entries[0].path);
                }
            } catch (e) {
                console.error('Failed to load projects:', e);
            }
        }

        function addEntry(nav, name, path) {
            entries.push({ name, path });
            const link = document.createElement('a');
            link.href = '#' + name;
            link.textContent = name;
            link.dataset.name = name;
            link.dataset.path = path;
            link.onclick = (e) => {
                e.preventDefault();
                selectLearning(name, path);
            };
            nav.appendChild(link);
        }

        function selectLearning(name, path) {
            history.replaceState(null, '', '#' + name);
            document.querySelectorAll('#projectList a').forEach(a => {
                a.classList.toggle('active', a.dataset.name === name);
            });
            loadLearningContent(path);
        }

        async function loadLearningContent(filename) {
            try {
                const res = await fetch('/api/files?path=learnings/' + filename);
                const text = await res.text();
                const html = marked.parse(text);
                document.getElementById('learningContent').innerHTML = html;
                addCopyButtonsToCodeBlocks();
            } catch (e) {
                document.getElementById('learningContent').innerHTML = '<p style="color:var(--color-gray-mid);">Failed to load learning</p>';
            }
        }

        function addCopyButtonsToCodeBlocks() {
            const codeBlocks = document.querySelectorAll('#learningContent pre code');
            codeBlocks.forEach(code => {
                const pre = code.parentElement;
                if (pre && !pre.querySelector('.copy-code-btn')) {
                    const button = document.createElement('button');
                    button.className = 'copy-code-btn';
                    button.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="5" y="5" width="9" height="9" rx="1"/>
                        <path d="M3 10V3a1 1 0 0 1 1-1h7"/>
                    </svg>`;
                    button.onclick = () => {
                        navigator.clipboard.writeText(code.textContent);
                    };
                    pre.appendChild(button);
                }
            });
        }

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.slice(1);
            const match = entries.find(e => e.name === hash);
            if (match) {
                selectLearning(match.name, match.path);
            }
        });

        loadProjects();
    </script>
</body>
</html>
