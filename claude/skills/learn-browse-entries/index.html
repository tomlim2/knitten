<!DOCTYPE html>
<!-- Design System: v1.8.1 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnings Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css">
    <link rel="stylesheet" href="/static/styles/markdown-reading.css">
    <script src="/static/scripts/marked.js"></script>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Skill Server</a>
        <nav class="nav">
            <a href="/">Skills</a>
            <a href="/skills/browse-commands">Commands</a>
            <a href="/skills/learn-browse-entries" class="active">Learnings</a>
            <a href="/skills/browse-standards">Standards</a>
            <a href="/skills/browse-usage">Usage</a>
            <a href="/files">Files</a>
        </nav>
    </header>
    <main class="main">
        <section class="page-hero page-hero--single">
            <div class="page-hero-content">
                <h1>Learnings</h1>
                <p>프로젝트별 학습 기록 및 인사이트</p>
                <div class="page-hero-meta-grid">
                    <div class="page-hero-meta-item">
                        <div class="page-hero-meta-label">LOCATION</div>
                        <div class="page-hero-meta-value"><code>~/.claude/private/learnings/</code></div>
                    </div>
                </div>
            </div>
        </section>

        <div class="page-layout page-layout--two-column">
            <article class="page-main markdown-body" id="learningContent">
                <p style="color:var(--color-gray-mid);font-size:12px;">Select a project to view learnings</p>
            </article>
            <aside class="page-sidebar">
                <h2 style="font-size:16px;font-weight:500;margin-bottom:16px;letter-spacing:0;">Projects</h2>
                <div id="projectList">Loading...</div>
            </aside>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <span class="footer-copyright">© 2026 Skill Server</span>
            <span class="footer-version">v1.7.0</span>
        </div>
    </footer>
    <script>
        async function loadProjects() {
            try {
                const res = await fetch('/api/files?path=learnings/projects');
                const data = await res.json();
                const projectList = document.getElementById('projectList');
                projectList.innerHTML = '';

                const ul = document.createElement('ul');
                ul.className = 'item-list';

                // Add template
                const templateLi = document.createElement('li');
                const templateLink = document.createElement('a');
                templateLink.href = '#';
                templateLink.style.color = 'var(--color-black)';
                templateLink.style.textDecoration = 'none';
                templateLink.textContent = '_template';
                templateLink.onclick = (e) => {
                    e.preventDefault();
                    loadLearning('_template.md');
                };
                templateLi.appendChild(templateLink);
                ul.appendChild(templateLi);

                // Add projects
                if (data.entries) {
                    data.entries.forEach(entry => {
                        if (entry.name.endsWith('.md')) {
                            const li = document.createElement('li');
                            const link = document.createElement('a');
                            link.href = '#';
                            link.style.color = 'var(--color-black)';
                            link.style.textDecoration = 'none';
                            link.textContent = entry.name.replace('.md', '');
                            link.onclick = (e) => {
                                e.preventDefault();
                                loadLearning('projects/' + entry.name);
                            };
                            li.appendChild(link);
                            ul.appendChild(li);
                        }
                    });
                }

                projectList.appendChild(ul);
            } catch (e) {
                console.error('Failed to load projects:', e);
            }
        }

        async function loadLearning(filename) {
            try {
                const res = await fetch('/api/files?path=learnings/' + filename);
                const text = await res.text();
                const html = marked.parse(text);
                document.getElementById('learningContent').innerHTML = html;
                addCopyButtonsToCodeBlocks();
            } catch (e) {
                document.getElementById('learningContent').innerHTML = '<p style="color:var(--color-gray-mid);">Failed to load learning</p>';
            }
        }

        function addCopyButtonsToCodeBlocks() {
            const codeBlocks = document.querySelectorAll('#learningContent pre code');
            codeBlocks.forEach(code => {
                const pre = code.parentElement;
                if (pre && !pre.querySelector('.copy-code-btn')) {
                    const button = document.createElement('button');
                    button.className = 'copy-code-btn';
                    button.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="5" y="5" width="9" height="9" rx="1"/>
                        <path d="M3 10V3a1 1 0 0 1 1-1h7"/>
                    </svg>`;
                    button.onclick = () => {
                        navigator.clipboard.writeText(code.textContent);
                    };
                    pre.appendChild(button);
                }
            });
        }

        loadProjects();
    </script>
</body>
</html>
