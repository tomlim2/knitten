<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnings Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css">
    <style>
        /* Code styling - based on research best practices */
        code {
            font-family: ui-monospace, Menlo, Monaco, "Cascadia Mono", "Segoe UI Mono",
                         "Roboto Mono", "Courier New", monospace;
            font-size: 0.85em;
        }

        /* Inline code - higher contrast for readability */
        :not(pre) > code {
            background: #eff1f3;
            color: #24292f;
            padding: 0.2em 0.4em;
            border-radius: 6px;
            border: 1px solid #d1d9e0;
            word-wrap: break-word;
            white-space: nowrap;
        }

        /* Code blocks - stronger visual distinction */
        pre {
            background: #f6f8fa;
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            overflow: auto;
            line-height: 1.45;
            margin: 16px 0;
        }

        pre code {
            background: transparent;
            padding: 0;
            font-size: 100%;
            white-space: pre;
            border: none;
            color: #1f2328;
        }

        .learning-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }
        .learning-table th,
        .learning-table td {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid var(--color-border);
            font-size: 14px;
        }
        .learning-table th {
            font-weight: 500;
            color: var(--color-gray-mid);
            background: var(--color-gray-light);
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Skill Server</a>
        <nav class="nav">
            <a href="/">Skills</a>
            <a href="/files">Files</a>
        </nav>
    </header>
    <main class="main">
        <section class="page-hero page-hero--single">
            <div class="page-hero-content">
                <h1 class="page-hero-name">Learnings</h1>
                <p class="page-hero-desc">프로젝트별 학습 기록 및 인사이트</p>
            </div>
        </section>

        <div class="page-layout">
            <article class="page-main" id="learningContent">
                <p style="color:var(--color-gray-mid);font-size:14px;">Select a project to view learnings</p>
            </article>

            <aside class="page-sidebar">
                <div class="page-sidebar-item">
                    <div class="page-sidebar-label">Projects</div>
                    <div class="page-sidebar-value" id="projectList">
                        Loading...
                    </div>
                </div>
                <div class="page-sidebar-item">
                    <div class="page-sidebar-label">Location</div>
                    <div class="page-sidebar-value">
                        <code>~/.claude/private/learnings/</code>
                    </div>
                </div>
            </aside>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <span class="footer-copyright">Learnings Viewer v0.3.1</span>
        </div>
    </footer>
    <script>
        async function loadProjects() {
            try {
                const res = await fetch('/api/files?path=learnings/projects');
                const data = await res.json();
                const projectList = document.getElementById('projectList');
                projectList.innerHTML = '';

                // Add template
                const templateLink = document.createElement('a');
                templateLink.href = '#';
                templateLink.className = 'page-sidebar-link';
                templateLink.style.display = 'block';
                templateLink.style.marginBottom = '8px';
                templateLink.textContent = '_template';
                templateLink.onclick = (e) => {
                    e.preventDefault();
                    loadLearning('_template.md');
                };
                projectList.appendChild(templateLink);

                // Add projects
                if (data.entries) {
                    data.entries.forEach(entry => {
                        if (entry.name.endsWith('.md')) {
                            const link = document.createElement('a');
                            link.href = '#';
                            link.className = 'page-sidebar-link';
                            link.style.display = 'block';
                            link.style.marginBottom = '8px';
                            link.textContent = entry.name.replace('.md', '');
                            link.onclick = (e) => {
                                e.preventDefault();
                                loadLearning('projects/' + entry.name);
                            };
                            projectList.appendChild(link);
                        }
                    });
                }
            } catch (e) {
                console.error('Failed to load projects:', e);
            }
        }

        async function loadLearning(filename) {
            try {
                const res = await fetch('/api/files?path=learnings/' + filename);
                const text = await res.text();
                renderLearning(text);
            } catch (e) {
                document.getElementById('learningContent').innerHTML = '<p style="color:var(--color-gray-mid);">Failed to load learning</p>';
            }
        }

        function renderLearning(markdown) {
            const content = document.getElementById('learningContent');
            const lines = markdown.split('\n');
            let html = '';
            let inTable = false;
            let tableRows = [];
            let inCodeBlock = false;
            let codeLines = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                // Handle code blocks
                if (line.startsWith('```')) {
                    if (inCodeBlock) {
                        // End code block
                        html += '<pre><code>' + codeLines.join('\n') + '</code></pre>';
                        codeLines = [];
                        inCodeBlock = false;
                    } else {
                        // Start code block
                        if (inTable) {
                            html += renderTable(tableRows);
                            tableRows = [];
                            inTable = false;
                        }
                        inCodeBlock = true;
                    }
                    continue;
                }

                if (inCodeBlock) {
                    codeLines.push(escapeHtml(line));
                    continue;
                }

                if (line.startsWith('# ')) {
                    html += `<h1 style="font-size:28px;font-weight:400;letter-spacing:-0.02em;margin:0 0 8px 0;">${line.slice(2)}</h1>`;
                } else if (line.startsWith('### ')) {
                    if (inTable) {
                        html += renderTable(tableRows);
                        tableRows = [];
                        inTable = false;
                    }
                    html += `<h3 style="font-size:16px;font-weight:500;margin:24px 0 8px 0;">${line.slice(4)}</h3>`;
                } else if (line.startsWith('## ')) {
                    if (inTable) {
                        html += renderTable(tableRows);
                        tableRows = [];
                        inTable = false;
                    }
                    html += `<h2 style="font-size:20px;font-weight:500;margin:32px 0 16px 0;color:var(--color-text);">${line.slice(3)}</h2>`;
                } else if (line.startsWith('| ') && line.includes(' | ')) {
                    inTable = true;
                    tableRows.push(line);
                } else if (line.startsWith('|---') && inTable) {
                    // Skip separator
                } else if (line.startsWith('---')) {
                    if (inTable) {
                        html += renderTable(tableRows);
                        tableRows = [];
                        inTable = false;
                    }
                    html += '<hr style="border:none;border-top:1px solid var(--color-border);margin:24px 0;">';
                } else if (line.startsWith('- ')) {
                    if (inTable) {
                        html += renderTable(tableRows);
                        tableRows = [];
                        inTable = false;
                    }
                    const text = line.slice(2).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/`(.*?)`/g, '<code>$1</code>');
                    html += `<li style="margin-left:20px;margin-bottom:12px;font-size:14px;line-height:1.8;">${text}</li>`;
                } else if (line.trim() === '') {
                    if (inTable) {
                        html += renderTable(tableRows);
                        tableRows = [];
                        inTable = false;
                    }
                } else if (line.trim() && !inTable) {
                    const text = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/`(.*?)`/g, '<code>$1</code>');
                    html += `<p style="font-size:14px;line-height:1.8;margin:10px 0;color:var(--color-gray-dark);">${text}</p>`;
                }
            }

            if (inTable) {
                html += renderTable(tableRows);
            }

            content.innerHTML = html || '<p style="color:var(--color-gray-mid);">No content</p>';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderTable(rows) {
            if (rows.length < 2) return '';

            const headers = rows[0].split('|').filter(c => c.trim()).map(c => c.trim());
            let html = '<table class="learning-table"><thead><tr>';
            headers.forEach(h => html += `<th>${h}</th>`);
            html += '</tr></thead><tbody>';

            for (let i = 2; i < rows.length; i++) {
                const cells = rows[i].split('|').filter(c => c.trim()).map(c => c.trim());
                html += '<tr>';
                cells.forEach(c => html += `<td>${c.replace(/\*\*/g, '')}</td>`);
                html += '</tr>';
            }

            html += '</tbody></table>';
            return html;
        }

        loadProjects();
    </script>
</body>
</html>
