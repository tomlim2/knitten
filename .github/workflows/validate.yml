name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check committed whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check "HEAD^..HEAD"
          else
            git diff --check HEAD
          fi

      - name: Validate plugin manifest
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          // Keep this list in sync with docs/specs/plugin-native-core-reboot.md.
          const requiredFiles = [
            ".codex-plugin/plugin.json",
            ".github/workflows/validate.yml",
            ".gitignore",
            "LICENSE",
            "README.md",
            "SYSTEM.md",
            "agent/AGENTS.md",
            "docs/specs/doctor-status-skill.md",
            "docs/specs/plugin-native-core-reboot.md",
            "document-templates/agent-hub/spec.md",
            "scripts/doctor.mjs",
            "scripts/materialize-local-plugin.mjs",
            "scripts/resolve-output.mjs",
            "bin/knitten-resolve-output",
            "skills/knitten-status/SKILL.md",
          ];
          for (const file of requiredFiles) {
            if (!fs.existsSync(file)) throw new Error(`missing required file: ${file}`);
          }
          const allowed = new Set(requiredFiles);
          const files = execFileSync("git", ["ls-files"], { encoding: "utf8" })
            .trim()
            .split("\n")
            .filter(Boolean);
          for (const file of files) {
            const allowedSpec = file.startsWith("docs/specs/") && file.endsWith(".md");
            const allowedSkill = file.startsWith("skills/") && file.endsWith("/SKILL.md");
            const allowedTemplate = file.startsWith("document-templates/") && file.endsWith(".md");
            if (!allowed.has(file) && !allowedSpec && !allowedSkill && !allowedTemplate) {
              throw new Error(`unexpected file in minimal plugin shell: ${file}`);
            }
          }
          const manifest = JSON.parse(fs.readFileSync(".codex-plugin/plugin.json", "utf8"));
          for (const field of ["name", "version", "description", "interface"]) {
            if (!manifest[field]) throw new Error(`plugin manifest missing ${field}`);
          }
          if (manifest.name !== "knitten") throw new Error("plugin manifest name must be knitten");
          NODE

      - name: Check scripts
        run: |
          node --check scripts/doctor.mjs
          node --check scripts/materialize-local-plugin.mjs
          node --check scripts/resolve-output.mjs
          bash -n bin/knitten-resolve-output
          bin/knitten-resolve-output --kind=review-json --name=ci --workspace-root="$PWD" >/tmp/knitten-output.json
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const output = JSON.parse(fs.readFileSync("/tmp/knitten-output.json", "utf8"));
          const expectedPath = path.join(process.cwd(), ".agent-local", "ah", "reviews", "ci.json");
          if (fs.realpathSync(output.pluginRoot) !== fs.realpathSync(process.cwd())) {
            throw new Error(`unexpected pluginRoot: ${output.pluginRoot}`);
          }
          if (fs.realpathSync(output.hubRoot) !== fs.realpathSync(process.cwd())) {
            throw new Error(`unexpected hubRoot: ${output.hubRoot}`);
          }
          if (output.selectedPath !== expectedPath) {
            throw new Error(`unexpected selectedPath: ${output.selectedPath}`);
          }
          if (output.selectedDir !== path.dirname(expectedPath)) {
            throw new Error(`unexpected selectedDir: ${output.selectedDir}`);
          }
          if (output.selectedPersistence !== "local") {
            throw new Error(`unexpected selectedPersistence: ${output.selectedPersistence}`);
          }
          NODE
          if node scripts/resolve-output.mjs --kind=review-json --workspace-root="$PWD"; then
            echo "missing --name should fail" >&2
            exit 1
          fi
          if node scripts/resolve-output.mjs --kind=review-json --name='!!!' --workspace-root="$PWD"; then
            echo "unusable --name should fail" >&2
            exit 1
          fi
          marketplace_root="$(mktemp -d)"
          node scripts/materialize-local-plugin.mjs --marketplace-root="$marketplace_root" --cachebuster=ci
          node scripts/doctor.mjs --marketplace-root="$marketplace_root"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path(".codex-plugin/plugin.json").read_text())
          for field in ("name", "version", "description", "interface", "skills"):
              if field not in manifest:
                  raise SystemExit(f"plugin manifest missing {field}")
          if manifest["name"] != "knitten":
              raise SystemExit("plugin manifest name must be knitten")
          PY
